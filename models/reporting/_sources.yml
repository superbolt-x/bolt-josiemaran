version: 2

sources:

  # ── Already-built tables ────────────────────────────────────────────────────
  # Declared as SOURCES, not ref()'d, on purpose. These tables are built and
  # paid for by the existing scheduled runs. A ref() would pull their whole
  # package lineage into every build of ours — one `dbt run` rebuilt
  # facebook_base.facebook_performance_by_campaign_daily (50s),
  # shopify_base.shopify_orders, _stg_googleads_campaigns_insights and
  # _stg_tiktok_campaigns_insights before it even reached our models.
  #
  # A source is read-only to dbt: it never builds them, so
  # `dbt run --select +blended_performance` builds three models, not fifteen.
  #
  # TRADE-OFF, worth knowing: because these are sources rather than refs, dbt
  # does not know they must be fresh before ours run. They are built earlier in
  # the same daily job, so ordering holds in practice — but if you ever run our
  # models in isolation against a stale warehouse, they will happily read stale
  # data. `dbt source freshness` is the guard if that becomes a concern.
  - name: reporting
    schema: reporting
    description: >
      Platform reporting tables built by the packages. Read-only here.
    tables:
      - name: josiemaran_facebook_performance_by_campaign
      - name: josiemaran_googleads_performance_by_campaign
      - name: josiemaran_tiktok_performance_by_campaign
      - name: josiemaran_shopify_daily_sales_by_order
      - name: josiemaran_facebook_performance_by_ad
        description: >
          Ad grain. Used only for the adset_id → campaign_id lookup that GA4's
          Meta sessions need. Verified unique: no adset maps to two campaigns.

  # ── Raw Facebook catalog-segment insights ──────────────────────────────────
  # The Facebook package does not surface these, so they are declared here.
  # Named `facebook_catalog_raw` rather than `facebook` to avoid colliding with
  # the source the package declares over the same schema.
  - name: facebook_catalog_raw
    schema: facebook_raw
    description: >
      Collaborative Ads (CPAS) catalog-segment insights — the only place
      Sephora purchase conversions appear. The Sephora pixel fires on
      sephora.com, so nothing lands in the Meta account's own purchase columns
      or in Shopify. Long/EAV: one row per entity × date × action_type.
    tables:
      - name: campaigns_insights_catalog_segment_actions
        description: "Conversion COUNTS by action_type."
        columns:
          - name: action_type
            description: >
              Action types NEST — omni_purchase = fb_pixel_purchase +
              offline_conversion.purchase + app_custom_event.fb_mobile_purchase,
              and view_content is identical to omni_view_content. NEVER SUM
              across action_type; always pivot named types.
      - name: campaigns_insights_catalog_segment_value
        description: "Conversion VALUES by action_type. Same grain, same nesting rule."

  # ── GA4 ─────────────────────────────────────────────────────────────────────
  # Read straight from raw — there is no reporting model for GA4 and it does not
  # need one. Daily grain, one property, history from 2024-08-17 (deeper than
  # Shopify order history, which starts 2026-07-27).
  - name: ga4_raw
    schema: ga4_raw
    tables:
      - name: traffic_sources_session
        description: >
          Session-level traffic sources with purchase conversions. `session_
          campaign_id` is directly usable for Google Ads but NOT for Meta —
          see the ga4_resolved CTE in blended_performance.
        columns:
          - name: session_campaign_id
            description: >
              Google: the real campaign ID (14 distinct numeric values).
              Meta: `<adset_id>_v2_sNN` — the prefix is the ADSET id, not the
              campaign id, so it needs split_part + an adset→campaign lookup.
              1,438 of 1,456 distinct Meta values match `^[0-9]{15,20}_`, 13
              are bare adset ids, 5 are neither.
