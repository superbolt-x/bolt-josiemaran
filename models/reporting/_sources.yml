version: 2

sources:

  # ── Already-built tables ────────────────────────────────────────────────────
  # Declared as SOURCES, not ref()'d, on purpose. These tables are built and
  # paid for by the existing scheduled runs. A ref() would pull their whole
  # package lineage into every build of ours — one `dbt run` rebuilt
  # facebook_base.facebook_performance_by_campaign_daily (50s),
  # shopify_base.shopify_orders, _stg_googleads_campaigns_insights and
  # _stg_tiktok_campaigns_insights before it even reached our models.
  #
  # A source is read-only to dbt: it never builds them, so
  # `dbt run --select +blended_performance` builds three models, not fifteen.
  #
  # TRADE-OFF, worth knowing: because these are sources rather than refs, dbt
  # does not know they must be fresh before ours run. They are built earlier in
  # the same daily job, so ordering holds in practice — but if you ever run our
  # models in isolation against a stale warehouse, they will happily read stale
  # data. `dbt source freshness` is the guard if that becomes a concern.
  - name: reporting
    schema: reporting
    description: >
      Platform reporting tables built by the packages. Read-only here.
    tables:
      - name: josiemaran_facebook_performance_by_campaign
      - name: josiemaran_googleads_performance_by_campaign
      - name: josiemaran_tiktok_performance_by_campaign
      - name: josiemaran_shopify_daily_sales_by_order
      - name: josiemaran_facebook_performance_by_ad
        description: >
          Ad grain. Now the primary Meta delivery source (rolled to adset), not
          just the adset_id → campaign_id lookup GA4's Meta sessions need —
          segment mapping has to happen per adset since one campaign spans two
          segments. Verified before switching: rolled up to campaign over
          2026-09-01..20 it matches josiemaran_facebook_performance_by_campaign
          to the cent on 7 of 8 campaigns, and differs by $0.27 on $14,905
          (0.002%) on the eighth — a deleted ad. Identical history depth.

  # ── Raw Facebook catalog-segment insights ──────────────────────────────────
  # The Facebook package does not surface these, so they are declared here.
  # Named `facebook_catalog_raw` rather than `facebook` to avoid colliding with
  # the source the package declares over the same schema.
  - name: facebook_catalog_raw
    schema: facebook_raw
    description: >
      Collaborative Ads (CPAS) catalog-segment insights — the only place
      Sephora purchase conversions appear. The Sephora pixel fires on
      sephora.com, so nothing lands in the Meta account's own purchase columns
      or in Shopify. Long/EAV: one row per entity × date × action_type.
    tables:
      # AD grain, keyed by ad_id. Used instead of the campaign-grain pair
      # below because one campaign (120250632750520303) holds a US adset and a
      # CA adset belonging to different report segments, so catalog
      # conversions have to be attributable per adset, not per campaign.
      # Verified equivalent before switching: rolled up to campaign over
      # 2026-09-01..20 these match the campaign-grain tables EXACTLY — zero
      # difference on purchases and add-to-cart — and both carry identical
      # history (from 2025-03-24), so nothing historical moves.
      - name: ads_insights_catalog_segment_actions
        description: "Conversion COUNTS by action_type, ad grain. Same nesting rule."
        columns:
          - name: action_type
            description: >
              Action types NEST — omni_purchase = fb_pixel_purchase +
              offline_conversion.purchase + app_custom_event.fb_mobile_purchase,
              and view_content is identical to omni_view_content. NEVER SUM
              across action_type; always pivot named types.
      - name: ads_insights_catalog_segment_value
        description: "Conversion VALUES by action_type, ad grain. Same nesting rule."

      # Campaign grain — superseded by the ad-grain pair above, kept declared
      # because it is still the simplest cross-check when reconciling.
      - name: campaigns_insights_catalog_segment_actions
        description: "Conversion COUNTS by action_type."
        columns:
          - name: action_type
            description: >
              Action types NEST — omni_purchase = fb_pixel_purchase +
              offline_conversion.purchase + app_custom_event.fb_mobile_purchase,
              and view_content is identical to omni_view_content. NEVER SUM
              across action_type; always pivot named types.
      - name: campaigns_insights_catalog_segment_value
        description: "Conversion VALUES by action_type. Same grain, same nesting rule."

  # ── GA4 ─────────────────────────────────────────────────────────────────────
  # Read straight from raw — there is no reporting model for GA4 and it does not
  # need one. Daily grain, one property, history from 2024-08-17 (deeper than
  # Shopify order history, which starts 2026-07-27).
  - name: ga4_raw
    schema: ga4_raw
    tables:
      - name: traffic_sources_session
        description: >
          Session-level traffic sources with purchase conversions. `session_
          campaign_id` is directly usable for Google Ads but NOT for Meta —
          see the ga4_resolved CTE in blended_performance.
        columns:
          - name: session_campaign_id
            description: >
              Google: the real campaign ID (14 distinct numeric values).
              Meta: `<adset_id>_v2_sNN` — the prefix is the ADSET id, not the
              campaign id, so it needs split_part + an adset→campaign lookup.
              1,438 of 1,456 distinct Meta values match `^[0-9]{15,20}_`, 13
              are bare adset ids, 5 are neither.

  # ── TikTok GMV Max ──────────────────────────────────────────────────────────
  # Named `tiktok_gmv_raw` rather than `tiktok_raw` to avoid colliding with the
  # source the TikTok package already declares over the same schema — same
  # reason `facebook_catalog_raw` is named the way it is.
  #
  # GMV Max campaigns appear in NO standard TikTok table: campaign
  # 1876696959444129 has zero rows in campaign_report_daily, campaign_history
  # and adgroup_history. TikTok reports them only through these endpoints.
  - name: tiktok_gmv_raw
    schema: tiktok_raw
    description: >
      TikTok GMV Max (TikTok Shop) campaign reporting. Separate API surface
      from the standard campaign endpoints — the TikTok package's sources
      never see these campaigns.
    tables:
      - name: gmv_campaign_report_daily
        description: >
          One row per campaign per day. Zero-padded back to 2025-09-25, a year
          before the only campaign was created (2026-09-18) — 361 of 369 rows
          are all-zero placeholders and must be filtered out.

          No impressions and no clicks, here or in gmv_advertiser_report_daily.
          CPM/CTR/CPC/CVR are therefore not derivable for GMV Max at all.
        columns:
          - name: gross_revenue
            description: >
              TikTok Shop GMV, not Shopify revenue. These orders never reach
              Shopify, so shopify_sales_by_segment cannot reconcile them.
          - name: net_cost
            description: >
              `cost` after TikTok ROI-protection rebates. The campaign carries
              roi_protection_compensation_status = 'IN_EFFECT', so this
              genuinely diverges from `cost` (2026-09-27: $115.18 vs $107.16).
      - name: gmv_max_campaign_history
        description: >
          Campaign metadata, one row per version keyed on `updated_at` —
          dedupe to the latest per campaign before joining.

  # ── Client daily budgets ────────────────────────────────────────────────────
  # NOT a Fivetran connector. budget_forecast_to_redshift.py (outside this repo,
  # josiemaran/ next to it) reads the client's "[EXT] Josie Maran 2026 Budgets"
  # sheet and loads one table, delete-and-insert per month tab, daily by cron.
  # Named `gsheet_budget_raw` rather than `gsheet_raw` so it can never collide
  # with a source a Fivetran Google Sheets connector might declare over the same
  # schema later — same reason `facebook_catalog_raw` and `tiktok_gmv_raw` are
  # named the way they are.
  - name: gsheet_budget_raw
    schema: gsheet_raw
    description: >
      Daily budget forecast by campaign, as planned in the client's budget
      sheet. Latest state only — forecast history is not kept.
    tables:
      - name: josie_maran_budget_forecast
        description: >
          One row per date × business_unit × platform × campaign_key. `budget`
          is the campaign's own daily total, so SUM(budget) never double counts;
          Sephora campaigns the sheet splits into Boosted / Evergreen carry the
          split in boosted_budget / evergreen_budget (NULL where there is none).
          Do not use the sheet's own 'Total Budget' row: it leaves out NB PMax.
        columns:
          - name: business_unit
            description: dtc | sephora_us | sephora_ca | sephora_kohls
          - name: platform
            description: meta | google | tiktok
          - name: campaign_key
            description: >
              Stable snake_case key for a budget line, e.g. prospecting_advplus,
              us_traffic. Not unique on its own: us_traffic exists under both
              meta and tiktok in Sephora US, so the key is
              (business_unit, platform, campaign_key).
